<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Inventory Check DPM</title>

  <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4361ee; --primary-soft: #eef2ff; --secondary: #3f37c9;
      --success: #06d6a0; --danger: #ef476f;
      --bg: #fdfeff; --card-bg: #ffffff; --text-main: #1e293b;
      --text-muted: #64748b; --radius: 18px;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg);
      background-image: radial-gradient(at 0% 0%, rgba(67,97,238,0.03) 0, transparent 50%),
                        radial-gradient(at 50% 0%, rgba(6,214,160,0.03) 0, transparent 50%);
      color: var(--text-main); margin: 0; padding: 12px;
      overflow-x: hidden; min-height: 100vh;
    }
    .container { width: 100%; max-width: 480px; margin: 0 auto; padding-bottom: 40px; }
    .card {
      background: var(--card-bg); padding: 20px; border-radius: var(--radius);
      box-shadow: var(--shadow); margin-bottom: 16px;
      border: 1.5px solid #f1f5f9; width: 100%;
    }
    .main-btn {
      background: var(--primary); color: white; border: none; padding: 12px;
      border-radius: 12px; width: 100%; font-weight: 600; cursor: pointer;
    }
    #loader { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.9); z-index: 999; display: none; align-items: center; justify-content: center; flex-direction: column; }
    #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 12px; padding: 16px; position: fixed; z-index: 1000; left: 50%; bottom: 30px; transform: translateX(-50%); }
    #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
    @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
    @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
  </style>
</head>
<body>
<div class="container">
  <div class="header-app"><h2>Inventory Check DPM</h2><p>Auto-fill & Expiration Tracking</p></div>
  <div class="card">
    <label>Barcode / SKU *</label>
    <div style="display:flex;gap:8px;margin-bottom:10px;">
      <input type="text" id="barcode" placeholder="Scan/Ketik..." style="margin-bottom:0;" onkeypress="if(event.key==='Enter'){event.preventDefault();validateBarcodeInput();}">
      <button type="button" class="main-btn" style="width:auto;padding:0 12px;flex-shrink:0;background:var(--success);color:#fff;" onclick="validateBarcodeInput()">✔️</button>
    </div>
    <div id="masterStatus" style="font-size:11px;padding:4px 8px;border-radius:4px;margin-bottom:10px;background:#fef3c7;color:#92400e;">⏳ Memuat data master...</div>
  </div>
  
  <div class="card" id="cardDept">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <label>Departemen *</label>
        <button id="btnRTC" type="button" style="padding:4px 8px;border-radius:6px;border:1px solid #ccc;background:#f8fafc;cursor:pointer;" onclick="toggleRTC()">RTC: OFF</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4, 1fr);gap:8px;">
      <div class="btn-dept" onclick="selectDept('GROCERY', this)">GROCERY</div>
      <div class="btn-dept" onclick="selectDept('DND', this)">DND</div>
      <div class="btn-dept" onclick="selectDept('GMS', this)">GMS</div>
      <div class="btn-dept" onclick="selectDept('HBC', this)">HBC</div>
      <div class="btn-dept" onclick="selectDept('DELSUSBAK', this)">DELSUSBAK</div>
      <div class="btn-dept" onclick="selectDept('PRODUCE', this)">PRODUCE</div>
      <div class="btn-dept" onclick="selectDept('NONFOOD', this)">NONFOOD</div>
      <div class="btn-dept" onclick="selectDept('RTC', this)">RTC</div>
    </div>
  </div>
  
  <div class="card">
    <label>Kategori Produk *</label>
    <input type="text" id="kategori" list="katList" placeholder="Pilih Dept/Ketik Kategori">
    <datalist id="katList"></datalist>
  </div>
  
  <div class="card">
    <label>Keterangan Barang</label>
    <input type="text" id="deskripsi" placeholder="Deskripsi barang...">
  </div>
  
  <div class="card">
    <label>Expired Date *</label>
    <input type="date" id="expiredDate">
  </div>
  
  <button class="main-btn" onclick="saveData()">Submit Inventory</button>
</div>

<div id="toast"></div>
<div id="loader"><div class="spinner-ring"></div><div id="loaderText">Memproses...</div></div>

<script>
  var SUPA_URL = 'https://tplmwztdiccknphhxbqo.supabase.co';
  var SUPA_KEY = 'sb_publishable_xnXPcfLL25YBFzv21jVWYg_d4_ZD4lf';
  var db = null;
  var masterData = [];
  var masterItemReady = false;
  var currentItemLimit = 0;
  var currentItemLimitRTC = 0;
  var isRTCActive = false;
  var selectedDept = "";
  var CACHE_KEY = 'dataMasterCache';
  var CACHE_TS_KEY = 'dataMasterCacheTs';
  var CACHE_DURATION = 24 * 60 * 60 * 1000;

  function toggleRTC() {
    isRTCActive = !isRTCActive;
    var btn = document.getElementById('btnRTC');
    btn.style.background = isRTCActive ? '#ef476f' : '#f8fafc';
    btn.style.color = isRTCActive ? '#fff' : '#000';
    btn.textContent = 'RTC: ' + (isRTCActive ? 'ON' : 'OFF');
  }

  function updateMasterStatus(ready, count) {
    var statusEl = document.getElementById('masterStatus');
    if (!statusEl) return;
    if (ready) {
      statusEl.style.background = '#d1fae5';
      statusEl.style.color = '#065f46';
      statusEl.innerHTML = '✅ Data master siap (' + count + ' items)';
    }
  }

  window.onload = function() {
    if (window.supabase && window.supabase.createClient) db = window.supabase.createClient(SUPA_URL, SUPA_KEY);
    if (db) fetchDataMaster();
  };

  function fetchDataMaster() {
    var cachedData = localStorage.getItem(CACHE_KEY);
    var cachedTs = localStorage.getItem(CACHE_TS_KEY);
    if (cachedData && cachedTs && (Date.now() - parseInt(cachedTs) < CACHE_DURATION)) {
      masterData = JSON.parse(cachedData);
      masterItemReady = true;
      updateMasterStatus(true, masterData.length);
      return;
    }
    
    var from = 0, batch = 1000, allData = [];
    function fetchBatch() {
      db.from('data_master').select('*').range(from, from + batch - 1).then(function(res) {
        if (res.data) {
          allData = allData.concat(res.data);
          if (res.data.length === batch) { from += batch; fetchBatch(); }
          else {
            masterData = allData;
            masterItemReady = true;
            localStorage.setItem(CACHE_KEY, JSON.stringify(masterData));
            localStorage.setItem(CACHE_TS_KEY, Date.now());
            updateMasterStatus(true, masterData.length);
          }
        }
      });
    }
    fetchBatch();
  }

  function validateBarcodeInput() {
    var val = document.getElementById('barcode').value;
    if (!masterItemReady) { showToast('⏳ Loading data master...', 't-error'); return; }
    lookupBarcodeOrSku(val, true);
  }

  function lookupBarcodeOrSku(val, isValidate) {
    var cleanVal = String(val).trim();
    var item = masterData.find(function(m) {
      var b = String(m.barcode || '');
      var s = String(m.sku || '');
      return b === cleanVal || s === cleanVal;
    });

    if (item) {
      currentItemLimit = item.limit || 0;
      currentItemLimitRTC = item.limit_rtc || 0;
      document.getElementById('deskripsi').value = item.description || '';
      document.getElementById('kategori').value = item.kategori || '';
      selectDept(item.dept);
      showToast('✅ Barang ditemukan: ' + item.description, 't-success');
    } else if (isValidate) {
      showToast('❌ Tidak ditemukan.', 't-error');
    }
  }

  function selectDept(dept) {
    selectedDept = dept;
    document.querySelectorAll('.btn-dept').forEach(function(b) {
      b.classList.toggle('active', b.textContent === dept);
    });
  }

  function saveData() {
    var limitHari = isRTCActive ? currentItemLimitRTC : currentItemLimit;
    var expValue = document.getElementById("expiredDate").value;
    var today = new Date(); today.setHours(0,0,0,0);
    var expDate = new Date(expValue); expDate.setHours(0,0,0,0);
    var diffDays = Math.ceil((expDate - today) / 86400000);
    var remarks = diffDays <= limitHari ? "WARNING" : "AMAN";

    var payload = {
      dept: selectedDept,
      jenis_barang: document.getElementById("kategori").value,
      barcode: document.getElementById("barcode").value,
      deskripsi_barang: document.getElementById("deskripsi").value,
      expired_date: expValue,
      limit: limitHari,
      is_rtc: isRTCActive,
      remarks: remarks
    };

    db.from('data_expired').insert(payload).then(function(res) {
      if (res.error) showToast('Error: ' + res.error.message, 't-error');
      else showToast('✅ Data tersimpan!', 't-success');
    });
  }

  function showToast(m, t) {
      var tEl = document.getElementById('toast');
      tEl.textContent = m;
      tEl.className = 'show ' + t;
      setTimeout(function(){ tEl.className = ''; }, 3000);
  }
</script>
</body>
</html>
